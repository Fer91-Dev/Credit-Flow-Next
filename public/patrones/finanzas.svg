<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Patrón de fondo del plan de pagos: motivos de financiera en línea fina, al estilo del fondo
    de WhatsApp. Se usa como MÁSCARA (CSS mask-image), así que el color lo pone quien lo usa y
    funciona igual en tema oscuro y claro. Solo importa la transparencia: todo va en blanco.
    Cada motivo va dentro de un <g> con su posición y un leve giro, para que el mosaico no se
    lea como una grilla.
  -->

  <!-- Signo $ -->
  <g transform="translate(22 18) rotate(-12)">
    <path d="M17 7c-1.6-2.4-9-2.8-9 1.6 0 4.6 10 2.8 10 7.6 0 4.2-7.6 4.2-10 1.4"/>
    <path d="M12.6 2v24"/>
  </g>

  <!-- Moneda con $ -->
  <g transform="translate(78 44) rotate(8)">
    <circle cx="14" cy="14" r="13"/>
    <circle cx="14" cy="14" r="9.5"/>
    <path d="M17 10.4c-.9-1.3-5.2-1.5-5.2.9 0 2.6 5.8 1.6 5.8 4.3 0 2.4-4.4 2.4-5.8.8M14.4 7.6v12.8"/>
  </g>

  <!-- Billete -->
  <g transform="translate(146 14) rotate(-6)">
    <rect x="1" y="1" width="46" height="26" rx="3"/>
    <circle cx="24" cy="14" r="6"/>
    <path d="M7 7h4M37 21h4"/>
  </g>

  <!-- Gráfico de barras con tendencia -->
  <g transform="translate(236 28) rotate(10)">
    <path d="M2 34h40"/>
    <path d="M7 34V22M17 34V14M27 34V19M37 34V6"/>
    <path d="M5 16l10-8 9 5 13-11"/>
    <path d="M32 2h5v5"/>
  </g>

  <!-- Chanchito -->
  <g transform="translate(24 94) rotate(6)">
    <path d="M8 14c0-6 7-10 15-10 7 0 13 3 15 8l4-1-1 6c1 2 1 4 0 6l-4 1c-1 3-3 5-6 6v4h-5v-3h-8v3h-5v-5c-3-2-5-5-5-9-2 0-4-1-4-3"/>
    <circle cx="31" cy="12" r="1.2"/>
    <path d="M19 6h7"/>
  </g>

  <!-- Porcentaje -->
  <g transform="translate(108 104) rotate(-14)">
    <path d="M4 28L28 4"/>
    <circle cx="7" cy="7" r="5"/>
    <circle cx="25" cy="25" r="5"/>
  </g>

  <!-- Calculadora -->
  <g transform="translate(170 86) rotate(9)">
    <rect x="1" y="1" width="28" height="38" rx="4"/>
    <rect x="6" y="6" width="18" height="8" rx="1.5"/>
    <path d="M8 21h0M15 21h0M22 21h0M8 27h0M15 27h0M22 27h0M8 33h0M15 33h0M22 33h0" stroke-width="3.2"/>
  </g>

  <!-- Tarjeta -->
  <g transform="translate(234 112) rotate(-8)">
    <rect x="1" y="1" width="46" height="30" rx="4"/>
    <path d="M1 10h46"/>
    <path d="M8 22h12M28 22h6"/>
  </g>

  <!-- Billetera -->
  <g transform="translate(18 178) rotate(-9)">
    <path d="M36 9V5a3 3 0 0 0-3-3H6a4 4 0 0 0 0 8h32a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H6a4 4 0 0 1-4-4V6"/>
    <path d="M41 17h-8a4 4 0 0 0 0 8h8"/>
  </g>

  <!-- Pila de monedas -->
  <g transform="translate(96 170) rotate(5)">
    <ellipse cx="16" cy="6" rx="14" ry="5"/>
    <path d="M2 6v7c0 2.8 6.3 5 14 5s14-2.2 14-5V6"/>
    <path d="M2 13v7c0 2.8 6.3 5 14 5s14-2.2 14-5v-7"/>
    <path d="M2 20v7c0 2.8 6.3 5 14 5s14-2.2 14-5v-7"/>
  </g>

  <!-- Recibo -->
  <g transform="translate(168 164) rotate(-11)">
    <path d="M3 2h26v36l-4.3-3-4.3 3-4.4-3-4.3 3-4.4-3L3 38z"/>
    <path d="M9 11h14M9 17h14M9 23h8"/>
  </g>

  <!-- Bolsa de plata -->
  <g transform="translate(236 176) rotate(7)">
    <path d="M14 8l-4-6h18l-4 6"/>
    <path d="M14 8h10c8 5 13 13 13 21 0 6-5 9-18 9S1 35 1 29c0-8 5-16 13-21z"/>
    <path d="M22.5 18c-.8-1.2-5-1.4-5 .8 0 2.4 5.6 1.5 5.6 4 0 2.3-4.2 2.3-5.6.8M20 15.5v11.5"/>
  </g>

  <!-- Signo $ chico -->
  <g transform="translate(56 250) rotate(14)">
    <path d="M13 5c-1.2-1.8-6.8-2.1-6.8 1.2 0 3.5 7.6 2.1 7.6 5.8 0 3.2-5.8 3.2-7.6 1"/>
    <path d="M9.7 1v18"/>
  </g>

  <!-- Candado (seguridad) -->
  <g transform="translate(118 240) rotate(-6)">
    <rect x="2" y="14" width="26" height="20" rx="3"/>
    <path d="M8 14V9a7 7 0 0 1 14 0v5"/>
    <path d="M15 22v5"/>
  </g>

  <!-- Flecha de crecimiento -->
  <g transform="translate(186 236) rotate(4)">
    <path d="M2 30l12-12 8 8L38 8"/>
    <path d="M29 8h9v9"/>
  </g>

  <!-- Moneda chica -->
  <g transform="translate(262 252) rotate(-10)">
    <circle cx="11" cy="11" r="10"/>
    <path d="M13.4 8.2c-.7-1-4.1-1.2-4.1.7 0 2 4.6 1.2 4.6 3.4 0 1.9-3.5 1.9-4.6.6M11.2 6v10.4"/>
  </g>

  <!-- Puntitos de relleno -->
  <g stroke-width="2.6">
    <path d="M60 80h0M214 62h0M140 150h0M36 150h0M290 150h0M212 214h0M92 222h0M150 300h0M300 300h0M24 300h0"/>
  </g>
</svg>
